[project]
name = "aihub-knowledge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30",
  "starlette>=0.40,<0.47",
  "httpx>=0.27,<0.28",
  "anyio>=3.6,<4",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "qdrant-client==1.15.1",
  "watchfiles>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: requires a running Ollama service and real embedding model", "integration: requires local Postgres and Qdrant dev services"]

[tool.ruff]
line-length = 120
target-version = "py312"
