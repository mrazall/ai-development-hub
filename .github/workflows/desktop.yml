name: Desktop Windows

# Manual or on a release tag only: never for ordinary pushes or pull requests.
on:
  workflow_dispatch:
  # A release tag also builds the installer and attaches it to the release (free on public repos).
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          toolchain: 1.89.0
          targets: x86_64-pc-windows-msvc

      - name: Build worker bundle
        shell: bash
        run: bash scripts/build-worker-bundle.sh apps/desktop/src-tauri/resources

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Install desktop UI dependencies
        working-directory: apps/desktop/ui
        run: npm ci --no-audit --no-fund

      - name: Test Rust library
        working-directory: apps/desktop/src-tauri
        run: cargo test --no-default-features --lib

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: aihub-desktop-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" apps/desktop/src-tauri/target/release/bundle/nsis/*.exe --clobber
