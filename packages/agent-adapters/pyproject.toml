[project]
name = "aihub-agent-adapters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "websockets>=13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aihub_agents*"]

[project.scripts]
aihub-worker = "aihub_agents.worker:main"
aihub-migrate-profiles = "aihub_agents.migrate_profiles:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
