[package]
name = "aihub-desktop"
version = "0.1.0"
description = "AI Development Hub desktop shell"
authors = ["AI Development Hub"]
edition = "2021"

[lib]
name = "aihub_desktop_lib"
crate-type = ["lib"]

[features]
default = ["app"]
app = [
  "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification",
  "dep:tauri-plugin-store", "dep:tauri-plugin-opener", "dep:keyring",
  "dep:reqwest", "dep:tokio", "dep:tauri-plugin-updater"
]

[build-dependencies]
tauri-build = { version = "2.0.3", optional = true }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
regex = "1.11"
thiserror = "2.0"
encoding_rs = "0.8"
png = "0.18.1"
tauri = { version = "2.1.1", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = { version = "2.0.1", optional = true }
tauri-plugin-single-instance = { version = "2.0.1", optional = true }
tauri-plugin-notification = { version = "2.0.1", optional = true }
tauri-plugin-store = { version = "2.1.0", optional = true }
tauri-plugin-opener = { version = "2.2.0", optional = true }
tauri-plugin-updater = { version = "2.0.0", optional = true }
keyring = { version = "3.6.1", optional = true, features = ["windows-native"] }
reqwest = { version = "0.12.9", optional = true, default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1.41", optional = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
tempfile = "3.14"
