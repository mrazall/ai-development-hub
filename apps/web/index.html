<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Boot screen until the app renders (replaced by React). No script: the CSP forbids inline ones. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #141414;
      }
      @media (prefers-color-scheme: light) {
        .boot {
          background: #f4f4f2;
        }
        .boot circle {
          fill: #1f1f1e;
        }
        .boot circle:last-of-type {
          fill: #b07a1e;
        }
        .boot g {
          stroke: #8a8a85;
        }
      }
    </style>
    <title>AI Development Hub</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="AI Development Hub загружается" role="status">
        <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
          <g stroke="#A6A6A1" stroke-width="2.5" stroke-linecap="round">
            <line x1="17" y1="25" x2="43" y2="11" />
            <line x1="43" y1="11" x2="46" y2="39" />
            <line x1="17" y1="25" x2="24" y2="49" />
            <line x1="24" y1="49" x2="46" y2="39" />
            <line x1="17" y1="25" x2="46" y2="39" />
          </g>
          <circle cx="43" cy="11" r="7" fill="#F0F0ED" />
          <circle cx="17" cy="25" r="7" fill="#F0F0ED" />
          <circle cx="24" cy="49" r="7" fill="#F0F0ED" />
          <circle cx="46" cy="39" r="9" fill="#E6B85B" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
