name: aihub

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aihub}
      POSTGRES_USER: ${POSTGRES_USER:-aihub}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    networks: [aihub]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-56333}:6333"
    networks: [aihub]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 1536m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate-control:
    build:
      context: ..
      dockerfile: infra/docker/control-plane.Dockerfile
    image: aihub/control-plane:${AIHUB_VERSION:-dev}
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    environment:
      AIHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aihub}@postgres:5432/${POSTGRES_DB:-aihub}
      AIHUB_DB_PASSWORD_FILE: /run/secrets/postgres_password
      # control-plane Settings validates all its secrets at import time, Alembic included.
      AIHUB_SECRET_KEY_FILE: /run/secrets/control_secret_key
      AIHUB_INTERNAL_SECRET_FILE: /run/secrets/internal_secret
    secrets: [postgres_password, control_secret_key, internal_secret]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [aihub]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 512m
    cpus: "0.75"

  migrate-knowledge:
    build:
      context: ..
      dockerfile: infra/docker/knowledge.Dockerfile
    image: aihub/knowledge:${AIHUB_VERSION:-dev}
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    environment:
      AIHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aihub}@postgres:5432/${POSTGRES_DB:-aihub}
      AIHUB_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    networks: [aihub]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 512m
    cpus: "0.75"

  control-plane:
    build:
      context: ..
      dockerfile: infra/docker/control-plane.Dockerfile
    image: aihub/control-plane:${AIHUB_VERSION:-dev}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      AIHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aihub}@postgres:5432/${POSTGRES_DB:-aihub}
      AIHUB_DB_PASSWORD_FILE: /run/secrets/postgres_password
      AIHUB_SECRET_KEY_FILE: /run/secrets/control_secret_key
      AIHUB_INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      AIHUB_OLLAMA_URL: ${AIHUB_OLLAMA_URL:-http://ollama:11434}
      AIHUB_DATA_DIR: /data
    secrets: [postgres_password, control_secret_key, internal_secret]
    volumes:
      - control_data:/data   # chat attachments; survives redeploys
    command: ["uvicorn", "aihub_control.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate-control: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-58080}:8000"
    networks: [aihub]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v0/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  knowledge:
    build:
      context: ..
      dockerfile: infra/docker/knowledge.Dockerfile
    image: aihub/knowledge:${AIHUB_VERSION:-dev}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      AIHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aihub}@postgres:5432/${POSTGRES_DB:-aihub}
      AIHUB_DB_PASSWORD_FILE: /run/secrets/postgres_password
      AIHUB_QDRANT_URL: http://qdrant:6333
      AIHUB_OLLAMA_URL: ${AIHUB_OLLAMA_URL:-http://ollama:11434}
      AIHUB_EMBED_BACKEND: ${AIHUB_EMBED_BACKEND:-fake}
      AIHUB_INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      AIHUB_VAULT_DIR: /vault
    secrets: [postgres_password, internal_secret]
    volumes:
      - ${AIHUB_VAULT_HOST_DIR:-./vault}:/vault:ro
    command: ["uvicorn", "aihub_knowledge.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate-knowledge: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-58081}:8000"
    networks: [aihub]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama:0.11.10
    profiles: [embeddings]
    restart: unless-stopped
    networks: [aihub]
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 2g
    cpus: "2.0"
    security_opt: ["no-new-privileges:true"]
    pids_limit: 300

volumes:
  control_data:
  postgres_data:
  qdrant_data:
  ollama_models:

networks:
  aihub:
    driver: bridge

secrets:
  postgres_password:
    file: ${AIHUB_SECRETS_HOST_DIR:-./secrets}/postgres_password
  control_secret_key:
    file: ${AIHUB_SECRETS_HOST_DIR:-./secrets}/control_secret_key
  internal_secret:
    file: ${AIHUB_SECRETS_HOST_DIR:-./secrets}/internal_secret
